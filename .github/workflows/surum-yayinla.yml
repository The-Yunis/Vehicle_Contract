# v1.2.0 gibi bir etiket gönderildiğinde exe'yi derler ve GitHub Release olarak yayınlar.
# Programlar açılışta bu Release'i görür ve kullanıcıya "Güncelle" uyarısı gösterir.
name: Sürüm yayınla

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  derle:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"           # Türkçe karakterler Windows konsolunda hata vermesin
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Bağımlılıklar
        run: python -m pip install -r requirements.txt

      - name: Exe'yi derle
        run: python araclar/derle.py --etiket ${{ github.ref_name }}

      # Geçiş dönemi: v1.4.1 ve öncesi güncellemeyi eski adla arıyor; aynı exe'yi o adla da yükle
      - name: Eski adla uyumluluk kopyası
        run: Copy-Item DAGITIM/Makine_Kontrat.exe DAGITIM/KMS_Sozlesme.exe

      - name: Release oluştur
        uses: softprops/action-gh-release@v2
        with:
          name: Makine Kontrat ${{ github.ref_name }}
          body_path: build/notlar.md
          files: |
            DAGITIM/Makine_Kontrat.exe
            DAGITIM/KMS_Sozlesme.exe
